<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Weather App</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        body {
            background: #1e3a56;
            font-family: Arial, sans-serif;
            color: white;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #2d4d69;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
        }
        .search-box {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }
        .search-box input {
            width: 70%;
            padding: 8px;
            border: none;
            border-radius: 5px;
        }
        .search-box button {
            padding: 8px 15px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            margin-left: 5px;
        }
        .weather-icon {
            font-size: 50px;
        }
        .temperature {
            font-size: 48px;
            font-weight: bold;
        }
        .details {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .details div {
            flex: 1 1 45%;
            text-align: left;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h5>Current Weather</h5>
            <button>Report Weather</button>
        </div>
        <div class="search-box">
            <input type="text" id="ct" placeholder="Enter city name">
            <button onclick="weather()">Search</button>
        </div>
        <!-- <div class="weather-icon">☀️</div> -->
        <div class="weather-icon" id="img"></div>
        <div class="temperature" id="temp"></div>
        <p id="main"></p>
        <p id="mains"></p>
        <div class="details">
            <div>Air Quality: <span id=""></span></div>
            <div>Wind Speed: <span id="wind"></span></div>
            <div>Humidity: <span id="hum"></span></div>
            <div>Max Temp: <span id="max"></span></div>
            <div>Visibility: <span id="visibility"></span></div>
            <div>Min Temp: <span id="min"></span></div>
            <div>Pressure: <span id="pres"></span></div>
            <div>Feels Like: <span id="feels_like"></span></div>
            <div>sunset: <span id="sunsettime"></span></div>
            <div>sunrise: <span id="sunrisetime"></span></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
